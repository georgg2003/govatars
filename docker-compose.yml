# Infrastructure only: run Go services locally with `make run-server` / `make run-worker`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: govatars
      POSTGRES_PASSWORD: govatars
      POSTGRES_DB: govatars
    ports:
      - "5433:5432"
    volumes:
      - govatars_pg:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - govatars_minio:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - govatars_rabbit:/var/lib/rabbitmq

volumes:
  govatars_pg:
  govatars_minio:
  govatars_rabbit:
