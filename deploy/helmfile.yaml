# UNCOMMENT ONCE TO ADD REPOSITORIES
# repositories:
#   - name: grafana
#     url: https://grafana.github.io/helm-charts
#   - name: prometheus-community
#     url: https://prometheus-community.github.io/helm-charts
#   - name: open-telemetry
#     url: https://open-telemetry.github.io/opentelemetry-helm-charts
#   - name: jaegertracing
#     url: https://jaegertracing.github.io/helm-charts

helmDefaults:
  createNamespace: true
  wait: true
  timeout: 600
  historyMax: 5

releases:
  # ---------------------------------------------------------------------------
  # Инфраструктура (аналог postgres / rabbitmq / minio из compose)
  # ---------------------------------------------------------------------------
  - name: postgres
    namespace: govatars
    chart: oci://registry-1.docker.io/cloudpirates/postgres
    version: 0.19.5
    values:
      - fullnameOverride: postgres
        # как в docker-compose (postgres:16-alpine). PostgreSQL 18 сменил раскладку
        # данных (мажор-версионный подкаталог), что несовместимо со старым PVC.
        image:
          repository: postgres
          tag: "16-alpine"
        auth:
          username: govatars
          password: govatars
          database: govatars
        service:
          port: 5432
        persistence:
          enabled: true
          size: 1Gi

  - name: rabbitmq
    namespace: govatars
    chart: oci://registry-1.docker.io/cloudpirates/rabbitmq
    version: 0.21.4
    values:
      - fullnameOverride: rabbitmq
        auth:
          username: govatars
          password: govatars
        service:
          amqpPort: 5672
          managementPort: 15672
        persistence:
          enabled: true
          size: 1Gi

  - name: minio
    namespace: govatars
    chart: oci://registry-1.docker.io/cloudpirates/minio
    version: 0.13.0
    values:
      - fullnameOverride: minio
        auth:
          rootUser: minioadmin
          rootPassword: minioadmin
        defaultBuckets: avatars
        service:
          port: 9000
          consolePort: 9090
        persistence:
          enabled: true
          size: 2Gi

  # ---------------------------------------------------------------------------
  # Трейсинг (аналог jaeger all-in-one). Единый Service "jaeger" отдаёт и OTLP
  # (4317), и UI (16686) — как контейнер jaeger в compose.
  # ---------------------------------------------------------------------------
  - name: jaeger
    namespace: govatars
    chart: jaegertracing/jaeger
    values:
      - fullnameOverride: jaeger
        provisionDataStore:
          cassandra: false
          elasticsearch: false
        storage:
          type: memory
        allInOne:
          enabled: true
        agent:
          enabled: false
        collector:
          enabled: false
        query:
          enabled: false

  # ---------------------------------------------------------------------------
  # Логи (аналог loki). Single binary + файловое хранилище, Service "loki:3100".
  # ---------------------------------------------------------------------------
  - name: loki
    namespace: govatars
    chart: grafana/loki
    values:
      - deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          storage:
            type: filesystem
          limits_config:
            metric_aggregation_enabled: true
          pattern_ingester:
            enabled: false
        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            size: 2Gi
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        lokiCanary:
          enabled: false
        test:
          enabled: false
        gateway:
          enabled: false
        monitoring:
          selfMonitoring:
            enabled: false
            grafanaAgent:
              installOperator: false
          serviceMonitor:
            enabled: false

  # ---------------------------------------------------------------------------
  # Метрики (аналог prometheus + node_exporter)
  # ---------------------------------------------------------------------------
  - name: prometheus
    namespace: govatars
    chart: prometheus-community/prometheus
    values:
      - server:
          fullnameOverride: prometheus
          service:
            servicePort: 9090
          persistentVolume:
            enabled: true
            size: 2Gi
          global:
            scrape_interval: 15s
          scrape_configs:
            - job_name: prometheus
              static_configs:
                - targets: ["prometheus:9090"]
            - job_name: node
              static_configs:
                - targets: ["node-exporter:9100"]
            - job_name: otel-collector
              static_configs:
                - targets: ["otel-collector:8889"]
        prometheus-node-exporter:
          enabled: true
          fullnameOverride: node-exporter
        alertmanager:
          enabled: false
        prometheus-pushgateway:
          enabled: false
        kube-state-metrics:
          enabled: false

  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector (аналог otel-collector).
  # Конфиг повторяет otel-collector-config.yaml из compose.
  # ---------------------------------------------------------------------------
  - name: otel-collector
    namespace: govatars
    chart: open-telemetry/opentelemetry-collector
    needs:
      - govatars/loki
      - govatars/prometheus
      - govatars/jaeger
    values:
      - fullnameOverride: otel-collector
        mode: deployment
        image:
          repository: otel/opentelemetry-collector-contrib
        command:
          name: otelcol-contrib
        presets:
          logsCollection:
            enabled: false
          kubernetesAttributes:
            enabled: false
        ports:
          prometheus:
            enabled: true
            containerPort: 8889
            servicePort: 8889
            protocol: TCP
        config:
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
          processors:
            batch:
              timeout: 10s
              send_batch_size: 1024
          exporters:
            otlphttp/loki:
              endpoint: http://loki:3100/otlp
              compression: gzip
              tls:
                insecure: true
            prometheus:
              endpoint: 0.0.0.0:8889
              resource_to_telemetry_conversion:
                enabled: true
            otlp/traces:
              endpoint: jaeger:4317
              tls:
                insecure: true
          service:
            pipelines:
              logs:
                receivers: [otlp]
                processors: [batch]
                exporters: [otlphttp/loki]
              metrics:
                receivers: [otlp]
                processors: [batch]
                exporters: [prometheus]
              traces:
                receivers: [otlp]
                processors: [batch]
                exporters: [otlp/traces]

  # ---------------------------------------------------------------------------
  # Grafana + provisioning датасорсов (аналог grafana).
  # Дашборды подтягиваются sidecar-ом из ConfigMap'ов релиза grafana-dashboards.
  # ---------------------------------------------------------------------------
  - name: grafana
    namespace: govatars
    chart: grafana/grafana
    needs:
      - govatars/loki
      - govatars/prometheus
      - govatars/jaeger
    values:
      - fullnameOverride: grafana
        service:
          port: 3000
        adminUser: admin
        adminPassword: admin
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                uid: prometheus
                type: prometheus
                access: proxy
                url: http://prometheus:9090
                isDefault: false
                editable: true
                jsonData:
                  timeInterval: 15s
              - name: Loki
                uid: loki
                type: loki
                access: proxy
                url: http://loki:3100
                isDefault: true
                editable: true
                jsonData:
                  maxLines: 1000
              - name: Jaeger
                uid: jaeger
                type: jaeger
                access: proxy
                url: http://jaeger:16686
                isDefault: false
                editable: true
        sidecar:
          dashboards:
            enabled: true
            label: grafana_dashboard
            folderAnnotation: grafana_folder
            provider:
              foldersFromFilesStructure: true

  # дашборды Grafana из grafana/dashboards (через dashboard sidecar)
  - name: grafana-dashboards
    namespace: govatars
    chart: ./grafana-dashboards

  # ---------------------------------------------------------------------------
  # Приложение: server + worker + миграции (аналог server / worker / migrate)
  # ---------------------------------------------------------------------------
  - name: govatars
    namespace: govatars
    chart: ./govatars
    needs:
      - govatars/postgres
      - govatars/rabbitmq
      - govatars/minio
      - govatars/otel-collector
