app:
  name: govatars
  version: "1.0.0"

serviceAccount:
  create: true
  automountServiceAccountToken: false
  annotations: {}

# K8s Secret с credentials (чарт deploy/secrets, secretKeyRef).
secrets:
  app: govatars-app
  keys:
    postgresDSN: postgres_dsn
    rabbitmqURL: rabbitmq_url
    s3AccessKey: s3_access_key
    s3SecretKey: s3_secret_key

rbac:
  create: false
  rules: []

waitForDependencies:
  enabled: true
  image: busybox:1.36
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

postgres:
  host: postgres
  port: 5432
  user: govatars
  database: govatars

rabbitmq:
  host: rabbitmq
  port: 5672
  user: govatars

minio:
  host: minio
  port: 9000

otel:
  collectorHost: otel-collector
  collectorPort: 4317

http:
  publicBaseURL: "https://govatars.localhost"

# DB migrations — pre-install/pre-upgrade hook.
migrate:
  enabled: true
  image:
    repository: migrate/migrate
    tag: v4.19.0
    pullPolicy: IfNotPresent
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    capabilities:
      drop:
        - ALL

server:
  name: server
  replicaCount: 1

  image:
    repository: govatars-server
    pullPolicy: IfNotPresent
    tag: latest

  service:
    type: ClusterIP
    port: 8080

  containerPort: 8080

  ingress:
    enabled: true
    className: traefik
    host: govatars.localhost
    path: /
    pathType: Prefix
    annotations: {}
    tls:
      - hosts:
          - govatars.localhost
        secretName: govatars-ingress-tls

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

worker:
  name: worker
  replicaCount: 1

  containerPort: 8081

  livenessProbe:
    httpGet:
      path: /health
      port: health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    httpGet:
      path: /health
      port: health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5

  image:
    repository: govatars-worker
    pullPolicy: IfNotPresent
    tag: latest

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
