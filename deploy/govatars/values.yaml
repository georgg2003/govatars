app:
  name: govatars
  version: "1.0.0"

# Имена сервисов инфраструктуры в кластере (совпадают с именами сервисов compose).
# Используются для сборки строк подключения (env GOVATARS_*), как в docker-compose.
postgres:
  host: postgres
  port: 5432
  user: govatars
  password: govatars
  database: govatars

rabbitmq:
  host: rabbitmq
  port: 5672
  user: govatars
  password: govatars

minio:
  host: minio
  port: 9000
  rootUser: minioadmin
  rootPassword: minioadmin

otel:
  collectorHost: otel-collector
  collectorPort: 4317

http:
  publicBaseURL: "http://localhost:8080"

# DB migrations — pre-install/pre-upgrade hook.
migrate:
  enabled: true
  image:
    repository: migrate/migrate
    tag: v4.19.0
    pullPolicy: IfNotPresent

server:
  name: server
  replicaCount: 1

  image:
    repository: govatars-server
    pullPolicy: IfNotPresent
    tag: latest

  service:
    type: ClusterIP
    port: 8080

  containerPort: 8080

  # аналог healthcheck server из compose: GET /health
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5

  resources: {}

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

worker:
  name: worker
  replicaCount: 1

  image:
    repository: govatars-worker
    pullPolicy: IfNotPresent
    tag: latest

  resources: {}

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
