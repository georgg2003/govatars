{{- if .Values.migrate.enabled }}
# Миграции БД — аналог сервиса migrate из docker-compose.
# Выполняются как Helm-хук перед install/upgrade (аналог depends_on:
# service_completed_successfully для server/worker). ConfigMap с SQL-файлами
# создаётся тем же хуком с меньшим весом, чтобы существовать к моменту запуска Job.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "govatars.fullname" . }}-migrations
  labels:
    app.kubernetes.io/name: {{ .Values.app.name }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
{{- range $path, $_ := .Files.Glob "files/migrations/*.sql" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "govatars.fullname" . }}-migrate
  labels:
    app.kubernetes.io/name: {{ .Values.app.name }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.app.name }}
        app.kubernetes.io/component: migrate
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "govatars.fullname" . }}-migrate
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- end }}
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for {{ .Values.postgres.host }}:{{ .Values.postgres.port }}..."
              until nc -w2 {{ .Values.postgres.host }} {{ .Values.postgres.port }} </dev/null 2>/dev/null; do
                echo "postgres is not available, retrying in 2s"
                sleep 2
              done
              echo "postgres is available"
      containers:
        - name: migrate
          image: "{{ .Values.migrate.image.repository }}:{{ .Values.migrate.image.tag }}"
          imagePullPolicy: {{ .Values.migrate.image.pullPolicy }}
          args:
            - "-path=/migrations"
            - "-database=$(GOVATARS_POSTGRES_DSN)"
            - "up"
          env:
            {{- include "govatars.postgresDSNEnv" . | nindent 12 }}
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: {{ include "govatars.fullname" . }}-migrations
{{- end }}
