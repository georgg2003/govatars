{{- $ := . -}}
{{- $pgPass := include "secrets.value" (dict "root" $ "name" .Values.names.postgres "key" "postgres-password" "legacyName" "postgres" "legacyKey" "postgres-password") -}}
{{- $rmqPass := include "secrets.value" (dict "root" $ "name" .Values.names.rabbitmq "key" "password" "legacyName" "rabbitmq" "legacyKey" "password") -}}
{{- $rmqCookie := include "secrets.value" (dict "root" $ "name" .Values.names.rabbitmq "key" "erlang-cookie" "legacyName" "rabbitmq" "legacyKey" "erlang-cookie" "gen" "hex") -}}
{{- $minioPass := include "secrets.value" (dict "root" $ "name" .Values.names.minio "key" "root-password" "legacyName" "minio" "legacyKey" "root-password") -}}
{{- $gfPass := include "secrets.value" (dict "root" $ "name" .Values.names.grafana "key" "admin-password" "legacyName" "grafana" "legacyKey" "admin-password" "gen" "hex") -}}

{{- $minioUser := .Values.minio.user -}}
{{- $existingMinio := lookup "v1" "Secret" .Release.Namespace .Values.names.minio -}}
{{- if and $existingMinio $existingMinio.data (index $existingMinio.data "root-user") -}}
  {{- $minioUser = index $existingMinio.data "root-user" | b64dec -}}
{{- else -}}
  {{- $legacyMinio := lookup "v1" "Secret" .Release.Namespace "minio" -}}
  {{- if and $legacyMinio $legacyMinio.data (index $legacyMinio.data "root-user") -}}
    {{- $minioUser = index $legacyMinio.data "root-user" | b64dec -}}
  {{- end -}}
{{- end -}}

{{- $gfUser := .Values.grafana.user -}}
{{- $existingGf := lookup "v1" "Secret" .Release.Namespace .Values.names.grafana -}}
{{- if and $existingGf $existingGf.data (index $existingGf.data "admin-user") -}}
  {{- $gfUser = index $existingGf.data "admin-user" | b64dec -}}
{{- else -}}
  {{- $legacyGf := lookup "v1" "Secret" .Release.Namespace "grafana" -}}
  {{- if and $legacyGf $legacyGf.data (index $legacyGf.data "admin-user") -}}
    {{- $gfUser = index $legacyGf.data "admin-user" | b64dec -}}
  {{- end -}}
{{- end -}}

{{- $pgDSN := printf "postgres://%s:%s@%s:%v/%s?sslmode=disable" .Values.postgres.user $pgPass .Values.postgres.host .Values.postgres.port .Values.postgres.database -}}
{{- $rmqURL := printf "amqp://%s:%s@%s:%v/" .Values.rabbitmq.user $rmqPass .Values.rabbitmq.host .Values.rabbitmq.port -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.names.postgres }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  postgres-password: {{ $pgPass | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.names.rabbitmq }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ $rmqPass | quote }}
  erlang-cookie: {{ $rmqCookie | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.names.minio }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  root-user: {{ $minioUser | quote }}
  root-password: {{ $minioPass | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.names.grafana }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  admin-user: {{ $gfUser | quote }}
  admin-password: {{ $gfPass | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.names.app }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  postgres_dsn: {{ $pgDSN | quote }}
  rabbitmq_url: {{ $rmqURL | quote }}
  s3_access_key: {{ $minioUser | quote }}
  s3_secret_key: {{ $minioPass | quote }}
