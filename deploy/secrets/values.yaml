# Secrets names (used by infra charts and govatars via existingSecret / secretKeyRef).
names:
  postgres: govatars-postgres
  rabbitmq: govatars-rabbitmq
  minio: govatars-minio
  grafana: govatars-grafana
  app: govatars-app

postgres:
  user: govatars
  database: govatars
  host: postgres
  port: 5432

rabbitmq:
  user: govatars
  host: rabbitmq
  port: 5672

minio:
  user: minioadmin

grafana:
  user: admin
