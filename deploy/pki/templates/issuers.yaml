apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Values.issuers.selfSigned }}
  namespace: {{ .Release.Namespace }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.ca.secretName }}
  namespace: {{ .Release.Namespace }}
spec:
  isCA: true
  commonName: {{ .Values.ca.commonName }}
  secretName: {{ .Values.ca.secretName }}
  duration: {{ .Values.ca.duration }}
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: {{ .Values.issuers.selfSigned }}
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Values.issuers.ca }}
  namespace: {{ .Release.Namespace }}
spec:
  ca:
    secretName: {{ .Values.ca.secretName }}
