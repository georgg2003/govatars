{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-{{ trimSuffix ".json" (base $path) }}
  labels:
    # метка, по которой grafana dashboard sidecar импортирует дашборд
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Govatars"
data:
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
---
{{- end }}
